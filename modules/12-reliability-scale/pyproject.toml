[project]
name = "playwright-learning-12-reliability-scale"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["pytest>=8,<10", "playwright==1.61.0", "pytest-playwright==0.8.0", "pytest-xdist==3.8.0"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = ["smoke: small critical browser checks", "slow: broader browser coverage"]

